name: VidiJoy Video Test

on:
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and check video
        env:
          SHOTSTACK_API_KEY: ${{ secrets.SHOTSTACK_API_KEY }}
        run: |
          cat > video.json <<'EOF'
          {
            "timeline": {
              "tracks": [
                {
                  "clips": [
                    {
                      "asset": {
                        "type": "rich-text",
                        "text": "WELCOME TO VIDIJOY",
                        "font": {
                          "family": "Montserrat",
                          "color": "#ffffff",
                          "size": 32
                        },
                        "align": {
                          "horizontal": "center"
                        }
                      },
                      "start": 0,
                      "length": 5
                    }
                  ]
                }
              ]
            },
            "output": {
              "format": "mp4",
              "size": {
                "width": 1024,
                "height": 576
              }
            }
          }
          EOF

          response=$(curl --fail-with-body --silent --show-error \
            -X POST \
            https://api.shotstack.io/edit/stage/render \
            -H "Content-Type: application/json" \
            -H "x-api-key: $SHOTSTACK_API_KEY" \
            -d @video.json)

          echo "Render response received"

          render_id=$(echo "$response" | jq -r '.response.id')

          if [ -z "$render_id" ] || [ "$render_id" = "null" ]; then
            echo "Could not get render ID"
            exit 1
          fi

          echo "Render ID: $render_id"

          for i in {1..12}; do
            sleep 5

            result=$(curl --fail-with-body --silent --show-error \
              "https://api.shotstack.io/edit/stage/render/$render_id" \
              -H "x-api-key: $SHOTSTACK_API_KEY")

            status=$(echo "$result" | jq -r '.response.status')

            echo "Render status: $status"

            if [ "$status" = "done" ]; then
              echo "VIDEO READY!"
              echo "$result" | jq -r '.response.url'
              exit 0
            fi

            if [ "$status" = "failed" ]; then
              echo "$result" | jq -r '.response.error'
              exit 1
            fi
          done

          echo "Render is still processing. Run another status check later."
