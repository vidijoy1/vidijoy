name: VidiJoy Video Test

on:
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: Generate test video
        env:
          SHOTSTACK_API_KEY: ${{ secrets.SHOTSTACK_API_KEY }}
        run: |
          cat > video.json <<'EOF'
          {
            "timeline": {
              "tracks": [
                {
                  "clips": [
                    {
                      "asset": {
                        "type": "rich-text",
                        "text": "WELCOME TO VIDIJOY",
                        "font": {
                          "family": "Montserrat",
                          "color": "#ffffff",
                          "size": 32
                        },
                        "align": {
                          "horizontal": "center"
                        }
                      },
                      "start": 0,
                      "length": 5,
                      "transition": {
                        "in": "fade",
                        "out": "fade"
                      }
                    }
                  ]
                }
              ]
            },
            "output": {
              "format": "mp4",
              "size": {
                "width": 1024,
                "height": 576
              }
            }
          }
          EOF

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.shotstack.io/edit/stage/render \
            --header "Content-Type: application/json" \
            --header "x-api-key: ${SHOTSTACK_API_KEY}" \
            --data @video.json
