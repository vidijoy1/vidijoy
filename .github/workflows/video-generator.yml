name: VidiJoy Video Test

'on':
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and check video
        env:
          SHOTSTACK_API_KEY: ${{ secrets.SHOTSTACK_API_KEY }}
        run: |
          cat > video.json <<'EOF'
          {
            "timeline": {
              "tracks": [
                {
                  "clips": [
                    {
                      "asset": {
                        "type": "rich-text",
                        "text": "WELCOME TO VIDIJOY",
                        "font": {
                          "family": "Montserrat",
                          "color": "#ffffff",
                          "size": 32
                        },
                        "align": {
                          "horizontal": "center"
                        }
                      },
                      "start": 0,
                      "length": 5
                    }
                  ]
                }
              ]
            },
            "output": {
              "format": "mp4",
              "size": {
                "width": 1024,
                "height": 576
              }
            }
          }
          EOF

          echo "Sending video to Shotstack..."

          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.shotstack.io/edit/stage/render \
            --header "Content-Type: application/json" \
            --header "x-api-key: ${SHOTSTACK_API_KEY}" \
            --data @video.json)

          echo "$response"

          render_id=$(echo "$response" | jq -r '.response.id')

          if [ -z "$render_id" ] || [ "$render_id" = "null" ]; then
            echo "ERROR: Could not get render ID."
            exit 1
          fi

          echo "Render ID: $render_id"

          for i in {1..24}; do
            sleep 5

            result=$(curl --fail-with-body --silent --show-error \
              --request GET \
              --url "https://api.shotstack.io/edit/stage/render/$render_id" \
              --header "x-api-key: ${SHOTSTACK_API_KEY}")

            status=$(echo "$result" | jq -r '.response.status')

            echo "Check $i - Render status: $status"

            if [ "$status" = "done" ]; then
              echo "VIDEO READY!"
              echo "$result" | jq -r '.response.url'
              exit 0
            fi

            if [ "$status" = "failed" ]; then
              echo "VIDEO RENDER FAILED:"
              echo "$result"
              exit 1
            fi
          done

          echo "The video is still processing."
          echo "Render ID: $render_id"
          exit 1
